kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: frr
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 8080, hostPort: 8081 }
  - role: worker
    extraPortMappings:
      - { containerPort: 8080, hostPort: 8082 }
  - role: worker
    extraPortMappings:
      - { containerPort: 8080, hostPort: 8083 }
  - role: worker
    extraPortMappings:
      - { containerPort: 8080, hostPort: 8084 }
