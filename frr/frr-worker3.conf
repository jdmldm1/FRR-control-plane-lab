frr defaults traditional
hostname frr-worker3
log stdout informational
service integrated-vtysh-config
!
bfd
 profile fast
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
interface lo
 ip address 10.255.0.4/32
 ipv6 address fd00:255::4/128
 ip ospf area 0
 ipv6 ospf6 area 0
exit
!
interface eth1
 ip ospf area 0
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf bfd
 ip ospf bfd profile fast
 ipv6 ospf6 area 0
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
 ipv6 ospf6 bfd profile fast
exit
!
interface eth2
 ip ospf area 1
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf bfd
 ip ospf bfd profile fast
 ipv6 ospf6 area 1
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
 ipv6 ospf6 bfd profile fast
exit
!
router ospf
 ospf router-id 10.255.0.4
exit
!
router ospf6
 ospf6 router-id 10.255.0.4
exit
!
router bgp 65004
 bgp router-id 10.255.0.4
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor 10.10.24.2 remote-as 65002
 neighbor 10.10.24.2 timers 3 9
 neighbor 10.10.24.2 bfd profile fast
 neighbor fd00:10:24::2 remote-as 65002
 neighbor fd00:10:24::2 timers 3 9
 neighbor fd00:10:24::2 bfd profile fast
 address-family ipv4 unicast
  neighbor 10.10.24.2 activate
  network 10.255.0.4/32
 exit-address-family
 address-family ipv6 unicast
  neighbor fd00:10:24::2 activate
  network fd00:255::4/128
 exit-address-family
exit
!
