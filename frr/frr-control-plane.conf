frr defaults traditional
hostname frr-control-plane
log stdout informational
service integrated-vtysh-config
!
bfd
 profile fast
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
exit
!
interface lo
 ip address 10.255.0.1/32
 ipv6 address fd00:255::1/128
 ip ospf area 0
 ipv6 ospf6 area 0
exit
!
interface eth1
 ip ospf area 0
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf bfd
 ip ospf bfd profile fast
 ipv6 ospf6 area 0
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
 ipv6 ospf6 bfd profile fast
exit
!
interface eth2
 ip ospf area 0
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf bfd
 ip ospf bfd profile fast
 ipv6 ospf6 area 0
 ipv6 ospf6 hello-interval 1
 ipv6 ospf6 dead-interval 4
 ipv6 ospf6 bfd profile fast
exit
!
ip route 10.255.0.3/32 10.10.13.3 eth3 200
ipv6 route fd00:255::3/128 fd00:10:13::3 eth3 200
!
router ospf
 ospf router-id 10.255.0.1
exit
!
router ospf6
 ospf6 router-id 10.255.0.1
exit
!
